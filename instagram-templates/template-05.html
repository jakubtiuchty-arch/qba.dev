<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post 05 - VS Comparison</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .post {
            width: 1080px;
            height: 1080px;
            background: #0a0a0f;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 80px;
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 60px;
        }

        .comparison {
            display: flex;
            gap: 40px;
            flex: 1;
        }

        .side {
            flex: 1;
            padding: 40px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }

        .side-left {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
        }

        .side-right {
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid rgba(34, 197, 94, 0.3);
        }

        .side-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .side-left .side-title { color: #ef4444; }
        .side-right .side-title { color: #22c55e; }

        .side-list {
            list-style: none;
        }

        .side-list li {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .side-left .icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .side-right .icon {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .vs {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
            z-index: 10;
        }

        .logo {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo span { color: #a855f7; }
    </style>
</head>
<body>
    <div class="post">
        <h1 class="title">Landing page vs Wizytówka</h1>

        <div class="comparison">
            <div class="side side-left">
                <div class="side-title">Wizytówka</div>
                <ul class="side-list">
                    <li><span class="icon">✕</span> 10 podstron</li>
                    <li><span class="icon">✕</span> Rozproszenie uwagi</li>
                    <li><span class="icon">✕</span> Brak celu</li>
                    <li><span class="icon">✕</span> Niska konwersja</li>
                    <li><span class="icon">✕</span> Chaos informacyjny</li>
                </ul>
            </div>

            <div class="side side-right">
                <div class="side-title">Landing page</div>
                <ul class="side-list">
                    <li><span class="icon">✓</span> 1 strona</li>
                    <li><span class="icon">✓</span> 1 cel</li>
                    <li><span class="icon">✓</span> 1 CTA</li>
                    <li><span class="icon">✓</span> Wysoka konwersja</li>
                    <li><span class="icon">✓</span> Więcej klientów</li>
                </ul>
            </div>
        </div>

        <div class="vs">VS</div>

        <div class="logo">&lt;qba<span>.</span>dev/&gt;</div>
    </div>
</body>
</html>

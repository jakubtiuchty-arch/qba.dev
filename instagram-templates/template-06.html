<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post 06 - Checklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .post {
            width: 1080px;
            height: 1080px;
            background: #0a0a0f;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            position: relative;
        }

        .post::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(150px);
            opacity: 0.2;
        }

        .title {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 60px;
            line-height: 1.3;
        }

        .title span {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .checklist {
            list-style: none;
        }

        .checklist li {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 36px;
            color: #e2e8f0;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .checkbox {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            flex-shrink: 0;
        }

        .cta {
            margin-top: 50px;
            font-size: 28px;
            color: #6366f1;
            font-weight: 500;
        }

        .logo {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo span { color: #a855f7; }
    </style>
</head>
<body>
    <div class="post">
        <h1 class="title">5 rzeczy, które <span>MUSI mieć</span><br>Twoja strona</h1>

        <ul class="checklist">
            <li><span class="checkbox">✓</span> Responsywność (mobile)</li>
            <li><span class="checkbox">✓</span> Szybkość &lt;3s</li>
            <li><span class="checkbox">✓</span> Certyfikat SSL (https)</li>
            <li><span class="checkbox">✓</span> Formularz kontaktowy</li>
            <li><span class="checkbox">✓</span> Analityka (Google)</li>
        </ul>

        <p class="cta">Ile z nich ma Twoja strona? 🤔</p>

        <div class="logo">&lt;qba<span>.</span>dev/&gt;</div>
    </div>
</body>
</html>

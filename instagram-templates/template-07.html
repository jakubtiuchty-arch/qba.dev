<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post 07 - Local</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .post {
            width: 1080px;
            height: 1080px;
            background: #0a0a0f;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            position: relative;
            text-align: center;
        }

        .location-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        .location-icon svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: white;
            stroke-width: 2;
        }

        .title {
            font-size: 64px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 32px;
            color: #94a3b8;
            margin-bottom: 50px;
            line-height: 1.5;
        }

        .location-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 24px;
            color: #6366f1;
        }

        .logo {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo span { color: #a855f7; }
    </style>
</head>
<body>
    <div class="post">
        <div class="location-icon">
            <svg viewBox="0 0 24 24">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                <circle cx="12" cy="10" r="3"/>
            </svg>
        </div>

        <h1 class="title">Trzebnica →<br><span class="gradient-text">Internet</span></h1>

        <p class="subtitle">Pomagam lokalnym firmom<br>zaistnieć w sieci</p>

        <div class="location-tag">
            📍 Trzebnica i okolice (40km)
        </div>

        <div class="logo">&lt;qba<span>.</span>dev/&gt;</div>
    </div>
</body>
</html>

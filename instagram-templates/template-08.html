<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post 08 - Pricing</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .post {
            width: 1080px;
            height: 1080px;
            background: #0a0a0f;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 60px;
        }

        .title span {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pricing-grid {
            display: flex;
            gap: 30px;
        }

        .pricing-card {
            flex: 1;
            background: #14141f;
            border: 1px solid #2a2a3a;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
        }

        .pricing-card.featured {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            transform: scale(1.05);
        }

        .card-name {
            font-size: 24px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .featured .card-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .card-price {
            font-size: 56px;
            font-weight: 700;
            color: #ffffff;
        }

        .card-price span {
            font-size: 24px;
            font-weight: 400;
            color: #6b7280;
        }

        .featured .card-price span {
            color: rgba(255, 255, 255, 0.6);
        }

        .card-desc {
            font-size: 18px;
            color: #6b7280;
            margin-top: 15px;
        }

        .featured .card-desc {
            color: rgba(255, 255, 255, 0.7);
        }

        .cta {
            text-align: center;
            margin-top: 50px;
            font-size: 28px;
            color: #6366f1;
        }

        .logo {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo span { color: #a855f7; }
    </style>
</head>
<body>
    <div class="post">
        <h1 class="title">Ile kosztuje <span>strona?</span></h1>

        <div class="pricing-grid">
            <div class="pricing-card">
                <div class="card-name">Starter</div>
                <div class="card-price">2500 <span>zł</span></div>
                <div class="card-desc">Prosta strona</div>
            </div>

            <div class="pricing-card featured">
                <div class="card-name">Pro</div>
                <div class="card-price">4500 <span>zł</span></div>
                <div class="card-desc">Rozbudowany LP</div>
            </div>

            <div class="pricing-card">
                <div class="card-name">Premium</div>
                <div class="card-price">7500 <span>zł</span></div>
                <div class="card-desc">Full package</div>
            </div>
        </div>

        <p class="cta">Link w bio → bezpłatna wycena</p>

        <div class="logo">&lt;qba<span>.</span>dev/&gt;</div>
    </div>
</body>
</html>
